
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - TokoKita</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #edf2f7;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        /* Container password */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        /* Tombol mata password */
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 8px;
            width: auto;
            padding: 4px;
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 20px;
            cursor: pointer;
        }

        .toggle-password:hover {
            background: transparent;
            color: #2563eb;
        }

        /* Tombol login */
        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-login:hover {
            background: #1d4ed8;
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #pesan {
            margin-top: 15px;
            text-align: center;
            color: #dc2626;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>TokoKita Admin</h2>
        <p class="subtitle">Silakan login untuk melanjutkan</p>

        <form id="formLogin">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                placeholder="Masukkan username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                    aria-label="Tampilkan password"
                    aria-pressed="false"
                >
                    👁
                </button>

            </div>

            <button
                type="submit"
                class="btn-login"
                id="tombolLogin"
            >
                Login
            </button>

            <p id="pesan" role="alert"></p>

        </form>
    </div>

    <script>

        const form = document.getElementById("formLogin");

        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        // Fitur melihat dan menyembunyikan password
        togglePassword.addEventListener("click", function() {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";
                togglePassword.textContent = "🙈";

                togglePassword.setAttribute(
                    "aria-label",
                    "Sembunyikan password"
                );

                togglePassword.setAttribute("aria-pressed", "true");

            } else {

                passwordInput.type = "password";
                togglePassword.textContent = "👁";

                togglePassword.setAttribute(
                    "aria-label",
                    "Tampilkan password"
                );

                togglePassword.setAttribute("aria-pressed", "false");

            }

        });

        // Proses login admin
        form.addEventListener("submit", async function(e) {

            e.preventDefault();

            const tombol = document.getElementById("tombolLogin");
            const pesan = document.getElementById("pesan");

            tombol.disabled = true;
            tombol.textContent = "Memproses...";
            pesan.textContent = "";

            try {

                const response = await fetch("/api/admin/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "same-origin",

                    body: JSON.stringify({
                        username: document.getElementById("username").value,
                        password: passwordInput.value
                    })

                });

                const hasil = await response.json();

                if (!response.ok) {
                    throw new Error(hasil.pesan || "Login gagal");
                }

                window.location.href = "/admin.html";

            } catch (error) {

                pesan.textContent = error.message;

            } finally {

                tombol.disabled = false;
                tombol.textContent = "Login";

            }

        });

    </script>

</body>
</html>
